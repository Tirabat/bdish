<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        
        
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        
        header{
            background-color: #C2EFD4;
            display:flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            color: #224F34;
        }
        .logo{
            font-weight: 100;
            color: #224F34;
            font-family: Elephant;
            margin-right: 100px;
            font-size: 30px;
        }
        nav{
            
            display: flex;
            gap: 40px;
            color: #224F34;
            display:flex;
            align-items: center;
            
            
        }
        nav a{
            font-weight: 500;
            font-size: 15px;
            font-family: Poppins;
            text-decoration: none;
            color: #224F34;
                      
        }
        .korz{
            margin-left: 200px;
        }
        .login{
            
            font-size: 15px;
            width: 142px;
            height: 52px;
            background-color: #C2EFD4;
            border: 3px solid #224F34;
            display: flex;
            justify-content: center;
            align-items: center;     
            
        }
        section{
            width: 100%;
            background-color: #C2EFD4;
            height: 100vh;
            
        }
        .jgf{
            color: #224F34;
            display: flex;
            flex-direction: column;
        }
        .bottonjgf{
            width: 142px;
            height: 52px;
            color: white;
            background-color: #224F34;
            border: 1px solid #224f34;
            border-radius: 3px;
            font-family: Poppins;
            font-weight: 500;
            font-size: 20px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        

    </style>
</head>
<body>
    <header>
        <div class="logo">
            Rivo

        </div>
        <nav>
            <a href="">HOME</a>
            <a href="">SHOP</a>
            <a href="">FEATURES</a>
            <a href="">CONTACT</a>

            <div class="korz">
                <img src="png/Korz.png" alt="" width="50px">
            </div>
            <div class="login">
                <a href="">LOGIN</a>
            </div>
            
        </nav>
    </header>
    <main>
        <section>
            <div class="jgf">
                <h1>Discover and Find Your Own Fashion!</h1>
                <p>Explore our curated collection stylish clothing and accessories tailored to your unique taste.</p>
                <div class="bottonjgf">
                    <h6>Explore now</h6>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
